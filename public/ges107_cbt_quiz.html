":["Complete sexual abstinence / avoiding premarital sexual exposure","Engaging with multiple concurrent sex partners","Patronizing commercial sex workers with herbal remedies","Taking prophylactic antibiotics before every sexual encounter"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Abstinence from sexual intercourse completely removes exposure to sexually transmissible microbes.","source":"UI GES 107 Past Questions (Q133)"},{"id":134,"question":"The two main types of HIV (HIV-1 and HIV-2) differ in all the following characteristics EXCEPT:","options":["Rate of viral transmission and virulence (HIV-1 is more pathogenic)","Fundamental mode of transmission (both transmit via blood, sex, and vertical routes)","Global geographical distribution (HIV-1 is global; HIV-2 is mostly West Africa)","Progression timeline to clinical AIDS"],"correctAnswer":1,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Both HIV-1 and HIV-2 share the exact same modes of transmission (sexual intercourse, blood/blood products, and mother-to-child). They differ in virulence, rate of transmission, and global distribution.","source":"UI GES 107 Past Questions (Q134)"},{"id":135,"question":"The following are clinical disorders associated with the testes EXCEPT/INCLUDING:","options":["Cryptorchidism","Testicular torsion","Germinal cell aplasia / orchitis","All the above"],"correctAnswer":3,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"Cryptorchidism (undescended testes), testicular torsion (twisting of the spermatic cord), and orchitis/germinal cell disorders are all pathological conditions of the testes.","source":"UI GES 107 Past Questions (Q135)"},{"id":136,"question":"The two recognized taxonomic types of the Human Immunodeficiency Virus are:","options":["HIV-1 and HIV-2","HIV-A and HIV-B","HIV-C and HIV-D","HIV-Alpha and HIV-Beta"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"The two genetically distinct species of Human Immunodeficiency Virus are HIV-1 (responsible for the worldwide pandemic) and HIV-2.","source":"UI GES 107 Past Questions (Q136)"},{"id":137,"question":"Gender equality means that:","options":["Females have more rights and privileges than males","Disparity is reinforced between individuals based on biological sex","Both males and females enjoy equal rights, responsibilities, opportunities, and conditions to realize their full potential","Men and women must perform identical biological functions"],"correctAnswer":2,"topicId":"gender-society","topicName":"Gender Equality, Violence & Society","explanation":"Gender equality entails equal rights, responsibilities, and access to resources for women and men, boys and girls, without discrimination.","source":"UI GES 107 Past Questions (Q137)"},{"id":138,"question":"Caffeine is classified pharmacologically as an example of:","options":["A central nervous system stimulant","A sedative-hypnotic","A volatile inhalant","An opioid analgesic"],"correctAnswer":0,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"Caffeine acts as an adenosine receptor antagonist in the brain, promoting alertness and combating drowsiness as a CNS stimulant.","source":"UI GES 107 Past Questions (Q138)"},{"id":139,"question":"The following are recognized menstrual disorders in women EXCEPT:","options":["Menorrhagia (excessive bleeding) and Amenorrhea (absence of menstruation)","Metrorrhagia and Galactorrhoea (inappropriate milk secretion)","Dysmenorrhea (painful menstruation)","Polymenorrhea (abnormally frequent cycles)"],"correctAnswer":1,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"Galactorrhoea refers to spontaneous milk flow from the breast unassociated with childbirth or nursing; it is a disorder of lactation (hyperprolactinemia), not a menstrual disorder.","source":"UI GES 107 Past Questions (Q139)"},{"id":140,"question":"Nutritional deficiency of calcium can result in the following clinical disorders EXCEPT:","options":["Rickets in growing children","Beriberi","Enlarged epiphyseal wrists and ankles","Stunted skeletal growth and osteomalacia"],"correctAnswer":1,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Beriberi is caused by deficiency of Vitamin B1 (Thiamine), not calcium. Calcium and vitamin D deficiency cause rickets, osteomalacia, and skeletal deformities.","source":"UI GES 107 Past Questions (Q140)"},{"id":141,"question":"According to the NDHS report of 2008, what was the estimated life expectancy at birth for Nigerians?","options":["53 years","47 years","57 years","42 years"],"correctAnswer":1,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"According to the 2008 Nigeria Demographic and Health Survey (NDHS), the life expectancy at birth in Nigeria was reported at approximately 47 years.","source":"GES 107 Textbook Practice (Code 01, Q1)"},{"id":142,"question":"The average life expectancy at birth for Least Developed Countries (LDCs) benchmarked in the GES 107 text is:","options":["49 years","53 years","42 years","57 years"],"correctAnswer":1,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"The global benchmark for Least Developed Countries (LDCs) averaged around 53 years, indicating that Nigeria's 47 years fell below the average LDC baseline.","source":"GES 107 Textbook Practice (Code 01, Q2)"},{"id":143,"question":"The maternal mortality ratio for Nigeria in the 2008 NDHS was estimated at ______ per 100,000 live births:","options":["457","545","601","329"],"correctAnswer":1,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"The 2008 NDHS recorded a Maternal Mortality Ratio (MMR) of 545 maternal deaths per 100,000 live births.","source":"GES 107 Textbook Practice (Code 01, Q3)"},{"id":144,"question":"In Nigeria, approximately what percentages of urban and rural populations respectively have access to safe drinking water according to the course texts?","options":["58% and 64%","72% and 49%","67% and 53%","76% and 51%"],"correctAnswer":1,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"Studies in the text show substantial urban-rural disparity in Nigeria, with roughly 72% of urban dwellers having safe water access compared to only 49% of rural dwellers.","source":"GES 107 Textbook Practice (Code 01, Q4)"},{"id":145,"question":"Which acute complication accounts for approximately one quarter (25%) of all maternal deaths in Nigeria?","options":["HIV/AIDS","Malaria in pregnancy","Obstetric haemorrhage","Hypertension (Pre-eclampsia/Eclampsia)"],"correctAnswer":2,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"Postpartum and antepartum haemorrhage (excessive bleeding) accounts for about 25% of maternal fatalities, making it the single leading cause of maternal mortality.","source":"GES 107 Textbook Practice (Code 01, Q9)"},{"id":146,"question":"What does the abbreviation NDHS stand for?","options":["National Development Health Statistics","Nigerian Demographic Health Survey","National Demographic and Health Survey","Nigerian Development Health Strategy"],"correctAnswer":2,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"NDHS stands for National Demographic and Health Survey, the nationally representative statistical survey conducted across Nigerian households.","source":"GES 107 Textbook Practice (Code 01, Q15)"},{"id":147,"question":"What does DALY stand for in public health and epidemiology?","options":["Death adjustability and longevity yield","Disability-Adjusted Life Years","Death adjusted life years","Disease and Longevity Yield"],"correctAnswer":1,"topicId":"ncds-genetics","topicName":"Non-Communicable Diseases & Genetics","explanation":"Disability-Adjusted Life Year (DALY) is a standardized metric that measures the global burden of disease, calculated as the sum of years of life lost (YLL) and years lived with disability (YLD).","source":"GES 107 Textbook Practice (Code 01, Q31)"},{"id":148,"question":"Young people aged 10-24 years constitute approximately what percentage of the total population in Nigeria?","options":["Almost 30% (around 31-33%)","10-15%","50-60%","75%"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"According to demographic censuses cited in GES 107, young people aged 10-24 years account for approximately one-third (~30-33%) of Nigeria's total population.","source":"GES 107 Textbook Practice (Code 01, Q35)"},{"id":149,"question":"Studies referenced in GES 107 demonstrate that an individual who refrains from tobacco, maintains a nutritious diet, wears seat belts, and exercises regularly can expect to live up to approximately:","options":["65 years","70 years","75 years","80 years"],"correctAnswer":3,"topicId":"health-living","topicName":"Concept of Health & Healthy Living","explanation":"Epidemiological studies highlighted in GES 107 show that avoiding primary behavioral risk factors (tobacco, poor diet, physical inactivity, road injuries) extends healthy human life expectancy up to 80 years.","source":"GES 107 Textbook Practice (Code 01, Q34)"},{"id":150,"question":"According to World Health Organization (WHO), an adolescent is defined as any person between the ages of:","options":["10-19 years","10-14 years","15-24 years","12-18 years"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"WHO defines adolescents as individuals in the 10-19 years age group, and youth as 15-24 years. 'Young people' encompasses both (10-24 years).","source":"GES 107 Textbook Practice (Code 00, Q37)"},{"id":151,"question":"Which of the following is NOT a genuine sugar / carbohydrate?","options":["Glucose","Fructose","Sweetose","Galactose"],"correctAnswer":2,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Glucose, fructose, and galactose are physiological hexose monosaccharides; 'sweetose' is a fictitious term.","source":"GES 107 Mock Practice (Code 00, Q3)"},{"id":152,"question":"Which of the following carbohydrates is a disaccharide (complex double sugar)?","options":["Glucose","Maltose","Fructose","Galactose"],"correctAnswer":1,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Maltose (glucose + glucose), lactose (glucose + galactose), and sucrose (glucose + fructose) are disaccharides. Glucose, fructose, and galactose are single-unit monosaccharides.","source":"GES 107 Mock Practice (Code 00, Q4)"},{"id":153,"question":"All of the following are essential micro (trace) minerals EXCEPT:","options":["Zinc","Sodium","Iodine","Copper"],"correctAnswer":1,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Sodium, potassium, calcium, magnesium, and phosphorus are macro-minerals needed in large quantities (>100 mg/day). Zinc, iodine, and copper are micro/trace minerals needed in minute amounts.","source":"GES 107 Mock Practice (Code 00, Q5)"},{"id":154,"question":"Which of the following vitamins are BOTH water-soluble?","options":["Vitamins B and C","Vitamins A and E","Vitamins K and D","Vitamins C and A"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Vitamins B-complex and C are water-soluble. Vitamins A, D, E, and K (ADEK) are fat-soluble.","source":"GES 107 Mock Practice (Code 00, Q25)"},{"id":155,"question":"What is the chemical name for Vitamin B12?","options":["Retinol","Cyanocobalamin","Ascorbic acid","Riboflavin"],"correctAnswer":1,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Vitamin B12 is Cyanocobalamin; Retinol is Vitamin A; Ascorbic acid is Vitamin C; Riboflavin is Vitamin B2.","source":"GES 107 Mock Practice (Code 00, Q26)"},{"id":156,"question":"How much caloric energy is yielded by the complete oxidation of one gram of dietary fat?","options":["4 Kcal","7 Kcal","9 Kcal","12 Kcal"],"correctAnswer":2,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Fat provides 9 Kcal per gram (37 kJ/g), whereas carbohydrates and proteins provide 4 Kcal per gram (17 kJ/g).","source":"GES 107 Mock Practice (Code 00, Q21)"},{"id":157,"question":"What is the ultimate end-product of complete protein digestion in the human gastrointestinal tract?","options":["Fatty acids","Glucose","Amino acids","Glycerides"],"correctAnswer":2,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Proteins are long peptide polymers broken down by proteases into individual free amino acids, which are absorbed across the intestinal enterocytes.","source":"GES 107 Mock Practice (Code 00, Q22)"},{"id":158,"question":"The chemical deterioration of fats exposed to air, light, and heat resulting in unpleasant odor and off-flavor is called:","options":["Hydrogenation","Rancidity of fat","Esterification","Saponification"],"correctAnswer":1,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Rancidity (lipid oxidation and hydrolysis) occurs when unsaturated fatty acid double bonds are cleaved by atmospheric oxygen, producing volatile aldehydes and ketones.","source":"GES 107 CA Theory & MCQ"},{"id":159,"question":"Which carbohydrate component cannot be digested or broken down by human gastrointestinal enzymes but aids bowel regularity?","options":["Starch","Glycogen","Dietary Fibre (Cellulose)","Maltose"],"correctAnswer":2,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Humans lack the enzyme cellulase to hydrolyze beta-1,4-glycosidic bonds in dietary fiber; fiber adds bulk to stool, prevents constipation, and speeds transit time.","source":"GES 107 Mock Practice (Code 00, Q19)"},{"id":160,"question":"A deficiency of Vitamin A in children and adults causes impairment of dark adaptation known as:","options":["Scurvy","Night blindness (Nyctalopia)","Pellagra","Rickets"],"correctAnswer":1,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Vitamin A (retinal) is a vital prosthetic group for rhodopsin in retinal rod cells; its deficiency leads to defective dim-light vision (night blindness) and xerophthalmia.","source":"GES 107 Mock Practice (Code 00, Q6)"},{"id":161,"question":"How many basic links/elements constitute the epidemiologic 'Chain of Infection'?","options":["2 elements","4 elements","6 elements","8 elements"],"correctAnswer":2,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"The six elements in the chain of infection are: 1) Infectious agent, 2) Reservoir, 3) Portal of exit, 4) Mode of transmission, 5) Portal of entry, and 6) Susceptible host.","source":"GES 107 CA-01 (17 Oct 2015, Q3)"},{"id":162,"question":"Which of the following is NOT an element in the epidemiological chain of infection?","options":["Reservoir","Chain disruptor","Susceptible host","Portal of entry"],"correctAnswer":1,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"'Chain disruptor' is an intervention concept (like handwashing or vaccines), not a biological link in the transmission chain itself.","source":"GES 107 First Semester CA 2022 (Q15)"},{"id":163,"question":"Inanimate contaminated objects (such as doorknobs, syringes, cups, and towels) that facilitate pathogen transmission are termed:","options":["Vectors","Fomites","Reservoirs","Parasites"],"correctAnswer":1,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Fomites are inanimate surfaces or items that become colonized with infectious agents and serve as a mechanical transfer vehicle between hosts.","source":"GES 107 General CA 2023/2024"},{"id":164,"question":"Infections acquired by patients during hospital admission that were neither present nor incubating upon arrival are called:","options":["Iatrogenic infections","Nosocomial (hospital-acquired) infections","Opportunistic infections","Community-acquired infections"],"correctAnswer":1,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Nosocomial infections (e.g. MRSA surgical site infections, catheter-associated UTIs) develop during hospital care due to cross-contamination or invasive procedures.","source":"GES 107 CA Theory (Q15)"},{"id":165,"question":"Transmission of an infection resulting directly from a medical intervention, physician action, or diagnostic procedure is called:","options":["Vertical transmission","Catastrophic transmission","Iatrogenic transmission","Vectorial transmission"],"correctAnswer":2,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Iatrogenic transmission specifically refers to disease induction resulting from medical examinations, unsterile surgical tools, or contaminated injections administered by healthcare workers.","source":"GES 107 First Semester CA 2022 (Q14)"},{"id":166,"question":"Which protozoan parasite causes amoebic dysentery and severe diarrheal disease in Nigeria?","options":["Entamoeba histolytica","Staphylococcus aureus","Giardia lamblia","Plasmodium falciparum"],"correctAnswer":0,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Entamoeba histolytica invades the colonic epithelium, causing amoebic dysentery characterized by blood and mucus in stool.","source":"GES 107 Mock Practice (Code 00, Q30)"},{"id":167,"question":"Which microorganism is the specific causative agent of Bacterial Vaginosis?","options":["Treponema pallidum","Gardnerella vaginalis","Neisseria gonorrhoeae","Candida albicans"],"correctAnswer":1,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Bacterial vaginosis is characterized by an overgrowth of anaerobic organisms, predominantly Gardnerella vaginalis, replacing normal protective Lactobacillus.","source":"GES 107 First Semester CA 2022 (Q1)"},{"id":168,"question":"Which retroviral enzyme synthesizes complementary double-stranded DNA from the single-stranded viral RNA template of HIV?","options":["Integrase","DNA Helicase","Reverse Transcriptase","Protease"],"correctAnswer":2,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Reverse transcriptase (RNA-dependent DNA polymerase) transcribes HIV's viral RNA genome into viral cDNA inside the host cytoplasm prior to integration.","source":"GES 107 First Semester CA 2022 (Q5) & 2024"},{"id":169,"question":"What is the full medical meaning of the acronym HAART?","options":["High Anterior Antecedence of Reversible Transmission","Highly Active Anti-retroviral Therapy","Having Antiretroviral Active Reviral Treatment","Highly Activated Anti-retrovirus Treatment"],"correctAnswer":1,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"HAART stands for Highly Active Antiretroviral Therapy, the standard combination regimen of at least three antiretroviral drugs from different drug classes.","source":"GES 107 First Semester CA 2022 (Q18)"},{"id":170,"question":"The bacterium Treponema pallidum is the causative agent of which sexually transmitted infection?","options":["Gonorrhoea","Chlamydia","Syphilis","Chancroid"],"correctAnswer":2,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Treponema pallidum is the spirochete bacterium responsible for primary, secondary, and tertiary syphilis.","source":"GES 107 2024/2025 CA Batch 1"},{"id":171,"question":"The standard human menstrual cycle has an average duration of approximately:","options":["21 days","28 days","35 days","14 days"],"correctAnswer":1,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"While normal cycles range between 21 and 35 days, the classical clinical textbook average menstrual cycle duration is 28 days.","source":"GES 107 First Semester CA 2022 (Q39)"},{"id":172,"question":"The anatomical structure that conveys the ovulated secondary oocyte from the ovary to the uterine cavity is the:","options":["Cervix","Fallopian tube (Oviduct)","Urethra","Endometrium"],"correctAnswer":1,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"The Fallopian tubes (uterine tubes) catch the ovum discharged from the ovary via their fimbriae and provide the site where fertilization normally takes place.","source":"GES 107 General CA 2023/2024"},{"id":173,"question":"Newly produced spermatozoa undergo physiological maturation and are stored in which male reproductive organ?","options":["Testes","Seminiferous tubules","Epididymis","Prostate gland"],"correctAnswer":2,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"After generation in the seminiferous tubules of the testes, immature sperm cells migrate into the epididymis where they gain motility and are stored.","source":"GES 107 General CA 2023/2024 (Q7)"},{"id":174,"question":"How many chromosomes are present in a normal human spermatid or mature spermatozoon?","options":["46 chromosomes","23 chromosomes","22 chromosomes","24 chromosomes"],"correctAnswer":1,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"Spermatozoa are haploid gametes produced by meiotic reduction division and contain 23 single chromosomes (22 autosomes + 1 sex chromosome, X or Y).","source":"GES 107 Mock Practice (Code 00, Q34)"},{"id":175,"question":"The monthly series of follicular growth, ovulation, and luteal transformation occurring in the female gonad is termed the:","options":["Menstrual cycle","Ovarian cycle","Uterine cycle","Gestation cycle"],"correctAnswer":1,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"The ovarian cycle encompasses the follicular phase, ovulation, and luteal phase inside the ovary, whereas the uterine/menstrual cycle refers to changes in the endometrium.","source":"GES 107 First Semester CA 2022 (Q16)"},{"id":176,"question":"The primary hormone responsible for the development of female secondary sexual characteristics and endometrial proliferation is:","options":["Progesterone","Luteinizing Hormone (LH)","Oestrogen (Estrogen)","Follicle-Stimulating Hormone (FSH)"],"correctAnswer":2,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"Estrogen produced by developing ovarian follicles promotes female secondary sex characteristics (breasts, pelvic widening) and endometrial rebuilding.","source":"GES 107 General CA 2023/2024 (Q12)"},{"id":177,"question":"Spermatogenesis comprises two major developmental phases, namely:","options":["Meiosis and Spermiogenesis (transformation of spermatids to spermatozoa)","Mitosis and Cleavage","Fertilization and Implantation","Erection and Ejaculation"],"correctAnswer":0,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"Spermatogenesis includes: 1) Meiotic maturation divisions forming round haploid spermatids, and 2) Spermiogenesis, the cytological differentiation into flagellated spermatozoa.","source":"GES 107 CA Theory (CA-01, Q17)"},{"id":178,"question":"If a couple with sickle cell trait (AS) marries a partner who has sickle cell disease (SS), what is the statistical probability of each child having sickle cell disease (SS)?","options":["25% Chance","50% Chance","75% Chance","0% Chance"],"correctAnswer":1,"topicId":"ncds-genetics","topicName":"Non-Communicable Diseases & Genetics","explanation":"Punnett square for AS x SS: A allele combines with S (AS, 50%) and S allele combines with S (SS, 50%). Therefore, there is a 50% chance of a child with sickle cell disease (SS).","source":"GES 107 2024/2025 CA Batch 1"},{"id":179,"question":"All of the following are clinical manifestations of sickle cell disease EXCEPT:","options":["Protuberant abdomen","Small stature and thin limbs","Severe childhood obesity","Frequent painful bone crises (dactylitis)"],"correctAnswer":2,"topicId":"ncds-genetics","topicName":"Non-Communicable Diseases & Genetics","explanation":"Children with sickle cell disease display growth faltering, delayed weight gain, and lean muscle mass due to chronic hypermetabolism and hypoxia; obesity is not a characteristic.","source":"GES 107 First Semester CA 2022 (Q36)"},{"id":180,"question":"A drug specifically administered to lower elevated core body temperature during a febrile illness is known as:","options":["Analgesic","Antipyretic","Anti-inflammatory","Anti-emetic"],"correctAnswer":1,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"Antipyretics (e.g., paracetamol/acetaminophen) act on the hypothalamic thermoregulatory center to reduce fever.","source":"GES 107 Mock Practice (Code 00, Q50)"},{"id":181,"question":"The conscious development of institutional objectives, policies, and budgets without recognizing or addressing gender disparities is termed:","options":["Gender mainstreaming","Gender blindness","Gender bias","Gender equality"],"correctAnswer":1,"topicId":"gender-society","topicName":"Gender Equality, Violence & Society","explanation":"Gender blindness is the failure to recognize that gender is an essential determinant of social outcomes, creating programs that treat men and women identically without acknowledging inequalities.","source":"GES 107 First Semester CA 2022 (Q25)"},{"id":182,"question":"A rigid, over-simplified, and generalized belief applied uniformly to all members of a gender group is called a:","options":["Gender bias","Gender stereotype","Gender clause","Gender role"],"correctAnswer":1,"topicId":"gender-society","topicName":"Gender Equality, Violence & Society","explanation":"A gender stereotype is an overgeneralized preconception about attributes or roles that ought to be possessed or performed by women and men.","source":"GES 107 First Semester CA 2022 (Q26)"},{"id":183,"question":"Which of the following is NOT a legitimate pharmacological class of therapeutic medications?","options":["Anti-emetics (prevent vomiting)","Anti-infectives (combat microbes)","Anti-coma","Analgesics (relieve pain)"],"correctAnswer":2,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"'Anti-coma' is not a recognized pharmacological class; coma is managed through resuscitation, glucose, naloxone, or ICU supportive therapy.","source":"GES 107 First Semester CA 2022 (Q32)"},{"id":184,"question":"Which of the following constitutes an example of RATIONAL drug use?","options":["Over-prescribing multiple redundant antibiotics","Self-medication without professional consultation","Taking medications in the appropriate dose, interval, and full duration","Underusing antibiotics and stopping as soon as fever subsides"],"correctAnswer":2,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"Rational drug use requires patients to receive medications appropriate to their clinical needs, in doses that meet individual requirements, for an adequate period.","source":"GES 107 First Semester CA 2022 (Q30)"},{"id":185,"question":"Which opportunistic malignancy affecting vascular endothelial cells is classically associated with advanced HIV infection?","options":["Hepatocellular carcinoma","Kaposi's sarcoma","Ovarian cancer","Glioblastoma multiforme"],"correctAnswer":1,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Kaposi's sarcoma, caused by Human Herpesvirus 8 (HHV-8), causes bluish-purple cutaneous and visceral vascular lesions in immunosuppressed AIDS patients.","source":"GES 107 First Semester CA 2022 (Q8)"},{"id":186,"question":"Lassa fever is a hemorrhagic viral illness transmitted to humans through direct contact with food or household items contaminated with the urine or faeces of:","options":["Anopheles mosquitoes","Multimammate rats (Mastomys natalensis)","Fruit bats","Tsetse flies"],"correctAnswer":1,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Lassa mammarenavirus is harbored by the natal multimammate mouse/rat (Mastomys natalensis); humans acquire it via contact with rodent excreta.","source":"GES 107 2024/2025 CA Batch 1 (Q7)"},{"id":187,"question":"Which sexually transmitted pathogen is a parasitic flagellated protozoon that causes greenish-yellow frothy discharge and vaginitis?","options":["Neisseria gonorrhoeae","Trichomonas vaginalis","Chlamydia trachomatis","Candida albicans"],"correctAnswer":1,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Trichomoniasis is caused by the anaerobic flagellated protozoan parasite Trichomonas vaginalis.","source":"GES 107 2024/2025 CA Batch 1 (Q8)"},{"id":188,"question":"Who defined health as: 'A dynamic state of well-being characterized by a physical and mental potential, which satisfies the demands of life relative to age, culture, and personal responsibility'?","options":["WHO (World Health Organization)","Dr. Johannes Bircher","Saracchi","Professor Ademola"],"correctAnswer":1,"topicId":"health-living","topicName":"Concept of Health & Healthy Living","explanation":"Dr. Johannes Bircher (2005) proposed this famous modern dynamic definition of health emphasizing human potential satisfying life's demands relative to age and culture.","source":"GES 107 Past Questions (Page 5, Q1)"},{"id":189,"question":"The essential amino acids required in human adult nutrition:","options":["Can all be synthesized de novo by human liver enzymes","Cannot be synthesized by the human body in sufficient quantities and must be supplied in food","Are non-essential and can be omitted from meals","Only exist in synthetic supplements"],"correctAnswer":1,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Essential amino acids (e.g. leucine, isoleucine, lysine, methionine, phenylalanine, threonine, tryptophan, valine, histidine) cannot be synthesized by human metabolic pathways and must come from diet.","source":"GES 107 CA Theory (CA-01, Q11)"},{"id":190,"question":"In what year was the first adult HIV national seroprevalence survey in Nigeria reporting a 4.1% - 4.2% national prevalence benchmark conducted?","options":["1991","2001","2010","2020"],"correctAnswer":2,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"The 2010 National HIV Sero-prevalence Sentinel Survey in Nigeria established a benchmark national adult HIV prevalence of approximately 4.1% to 4.2%.","source":"GES 107 Textbook Practice (Code 01, Q20)"},{"id":191,"question":"Late adolescence spans between what ages according to the GES 107 syllabus?","options":["10-14 years","15-19 years","20-24 years","12-16 years"],"correctAnswer":1,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"In the course textbook, Early adolescence spans 10-14 years, while Late adolescence spans 15-19 years.","source":"GES 107 2nd Semester CA-01 (17 Oct 2015, Section A Q1)"},{"id":192,"question":"Health is described as 'dynamic' because:","options":["It is a static, unchanging state once reached","It is an active, continuously fluctuating state of equilibrium that responds to physical, mental, and environmental demands","It only depends on medical consultations in hospitals","It never changes throughout an individual's lifetime"],"correctAnswer":1,"topicId":"health-living","topicName":"Concept of Health & Healthy Living","explanation":"Health is not a fixed end-state; it is dynamic, active, and ever-changing as the body and mind continuously adapt to daily physical, psychological, and environmental pressures.","source":"GES 107 CA-01 Section A Q2 / Marking Scheme"},{"id":193,"question":"The nutritional status of an individual can be assessed through all the following clinical methods (the ABCD assessment) EXCEPT:","options":["Anthropometric measurements (height, weight, body mass index, arm circumference)","Biochemical and laboratory evaluations (hemoglobin, serum albumin, urinalysis)","Clinical and physical examinations of hair, skin, eyes, and tongue","Astrological star signs and fortune telling"],"correctAnswer":3,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Nutritional assessment relies on the validated 'ABCD' methods: Anthropometric, Biochemical, Clinical, and Dietary assessment. Horoscopes and astrology have zero scientific role.","source":"GES 107 2nd Semester CA-01 (Section A Q7)"},{"id":194,"question":"An Adverse Drug Reaction (ADR) is medically defined as:","options":["An expected, desirable therapeutic outcome after taking medication","Any noxious, unintended, and undesirable effect of a drug occurring at doses normally used for prophylaxis, diagnosis, or therapy","An intentional lethal overdose of medication","An allergic reaction occurring exclusively when expired drugs are ingested"],"correctAnswer":1,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"WHO defines an Adverse Drug Reaction as any response to a drug which is noxious and unintended, and which occurs at doses normally used in man for prophylaxis, diagnosis, or therapy.","source":"GES 107 2nd Semester CA-01 (Section B Q17)"},{"id":195,"question":"Adults in Nigeria are particularly at risk of HIV infection because of incorrect and incomplete knowledge of HIV transmission and prevention.","options":["True","False"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"True. Misconceptions regarding HIV modes of transmission, low risk perception, and lack of comprehensive knowledge leave many adults vulnerable to risky sexual practices.","source":"GES 107 2nd Semester CA-01 (Section B Q18)"},{"id":196,"question":"Prevention of HIV infection through education, abstinence, mutual fidelity, and barrier methods is the most effective way of combating the pandemic.","options":["True","False"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"True. Because there is currently no curative therapy or preventative vaccine, primary prevention remains the most effective global strategy to combat HIV/AIDS.","source":"GES 107 2nd Semester CA-01 (Section B Q19)"},{"id":197,"question":"Male latex condoms are not 100% effective in preventing HIV transmission even when used correctly and consistently.","options":["True","False"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"True. While condoms reduce HIV transmission risk by roughly 85% to 98% when used correctly, they are not 100% foolproof due to potential microscopic defects, breakage, or slippage.","source":"GES 107 2nd Semester CA-01 (Section B Q20)"},{"id":198,"question":"A preventative human HIV vaccine was officially produced and licensed in the year 2012.","options":["True","False"],"correctAnswer":1,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"False. No licensed preventive HIV vaccine exists. In 2012, Truvada was approved for Pre-Exposure Prophylaxis (PrEP), but that is an antiretroviral drug, not a vaccine.","source":"GES 107 2nd Semester CA-01 (Section B Q21)"},{"id":199,"question":"Antiretroviral therapy (ART) should be taken for two years and then stopped permanently once the patient feels healthy.","options":["True","False"],"correctAnswer":1,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"False. ART is a lifelong treatment. Stopping antiretroviral drugs causes viral rebound from latent reservoirs and leads to rapid immune decline and drug resistance.","source":"GES 107 2nd Semester CA-01 (Section B Q22)"},{"id":200,"question":"A youth subculture that displays systematic hostility, resistance, and opposition to the dominant culture of mainstream society is called a:","options":["Counterculture (or Delinquent youth subculture)","Conformist subculture","Corporate dominant culture","Professional association"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"In sociology, a counterculture is a subculture whose values and norms of behavior differ substantially from and actively oppose those of mainstream society.","source":"GES 107 2nd Semester CA-01 (Section B Q23)"},{"id":201,"question":"Hypertension is NOT a silent killer because patients always experience painful symptoms immediately.","options":["True","False"],"correctAnswer":1,"topicId":"ncds-genetics","topicName":"Non-Communicable Diseases & Genetics","explanation":"False. Hypertension is universally termed 'The Silent Killer' because it typically produces no noticeable symptoms for years while silently causing arterial damage, stroke, and heart failure.","source":"GES 107 2nd Semester CA-01 (Section B Q25)"},{"id":202,"question":"The essential clinical criteria that an individual with HIV must satisfy before initiating antiretroviral therapy (ART) include:","options":["Confirmed HIV diagnosis, clinical/immunological evaluation (CD4 staging), and patient willingness and readiness to commit to lifelong adherence","Having high personal financial wealth and owning a car","Being admitted to an intensive care unit","None of the above"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"ART initiation requires laboratory confirmation of HIV, assessment of clinical stage and baseline organ function, and patient readiness for strict lifelong adherence.","source":"GES 107 CA-01 (Page 3 Q11 / Marking Scheme)"},{"id":203,"question":"The three primary natural, synthetic, or industrial sources of pharmaceutical drugs are:","options":["Natural sources (plants, animals, minerals, microorganisms), Synthetic chemical synthesis, and Semi-synthetic modification","Rivers, oceans, and rainfall","Motor parks, retail stores, and open markets","None of the above"],"correctAnswer":0,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"Drugs originate from: 1) Natural sources (plants e.g. morphine, animals e.g. insulin, microorganisms e.g. penicillin), 2) Synthetic laboratory chemicals (e.g. paracetamol), and 3) Semi-synthetic modifications (e.g. ampicillin).","source":"GES 107 CA-01 (Page 3 Q15 / Marking Scheme)"},{"id":204,"question":"What is a drug according to pharmaceutical and medical definitions?","options":["Any chemical substance used in or on the human body for prevention (prophylaxis), diagnosis, alleviation, treatment of disease, or modification of physiological functions","Only illegal recreational narcotics","Any food that provides caloric carbohydrates","Any liquid that quenches thirst"],"correctAnswer":0,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"A drug is defined pharmacologically as any substance or mixture of substances manufactured or sold for use in diagnosis, treatment, mitigation, or prevention of disease or abnormal physical states.","source":"GES 107 CA-01 (Page 3 Q16)"},{"id":205,"question":"Long-term excessive dietary intake of simple carbohydrates and sugars leads primarily to:","options":["Overweight/obesity, dental caries, and increased risk of Type 2 Diabetes mellitus","Protein energy malnutrition (Kwashiorkor)","Severe dehydration and hypovolemia","Muscle atrophy and bone loss"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Surplus carbohydrates are converted by insulin and lipogenesis into triglycerides and stored as adipose tissue, causing obesity, insulin resistance, and dental caries.","source":"GES 107 1st Semester CA-01 (14 Aug 2014, Q3)"},{"id":206,"question":"How can sickle cell disease (HbSS) be effectively prevented from occurring in future offspring?","options":["Premarital genetic counseling and screening of intending couples to avoid AS x AS, AS x SS, or SS x SS unions","Vaccinating prospective parents before marriage","Taking high doses of folic acid during childhood","Drinking alkaline herbal solutions"],"correctAnswer":0,"topicId":"ncds-genetics","topicName":"Non-Communicable Diseases & Genetics","explanation":"Because sickle cell disease is an autosomal recessive inherited disorder, prospective premarital genotype screening and genetic counseling is the only primary preventive measure.","source":"GES 107 1st Semester CA-01 (14 Aug 2014, Q6)"},{"id":207,"question":"What is the mandatory first-aid step to take immediately following an accidental occupational needle-stick injury potentially exposed to HIV?","options":["Wash the puncture site thoroughly under running water with soap, avoid squeezing, and report immediately to an HIV center for PEP evaluation","Tie a tight tourniquet around the arm and wait until morning","Apply raw kerosene and cover with cotton wool","Squeeze the finger vigorously until tissue bruises"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Immediate washing with soap and running water reduces viral inoculum. The exposed worker must report immediately to begin PEP within 2 hours (and no later than 72 hours).","source":"GES 107 Marking Scheme (10 April 2013, Q1a)"},{"id":208,"question":"What is the recommended emergency protocol following sexual assault (rape) regarding HIV prevention?","options":["Report immediately to an emergency/HIV facility for forensic care, emergency contraception, baseline HIV testing, and initiation of a 28-day course of PEP within 72 hours","Take a hot shower and keep the incident a secret","Wait 3 months to see if symptoms appear before visiting a doctor","Take two aspirins and sleep"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Survivors of sexual assault require urgent comprehensive post-exposure management: trauma support, STI prophylaxis, emergency contraception, and immediate PEP initiation.","source":"GES 107 Marking Scheme (10 April 2013, Q1b)"},{"id":209,"question":"No two foods in nature are completely identical in their nutrient components and proportions.","options":["True","False"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"True. Each food commodity possesses a distinct profile of macro- and micronutrients, which is why a diversified balanced diet is essential to avoid specific nutrient deficiencies.","source":"GES 107 CA-01 (Section B Q24)"},{"id":210,"question":"Antibacterial antibiotics are very effective in curing fungal and viral infections.","options":["True","False"],"correctAnswer":1,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"False. Antibacterial antibiotics target bacterial cell walls, ribosomes, or DNA gyrase, and have zero efficacy against fungi (which require antifungals) or viruses (which require antivirals).","source":"GES 107 CA-01 (Section B Q25)"},{"id":211,"question":"The human body takes in water and can store it in the soft tissues for several weeks without needing fresh daily water intake.","options":["True","False"],"correctAnswer":1,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"False. The human body lacks a reservoir for storing excess water. Obligatory fluid loss through urine, sweat, respiration, and feces requires daily water replenishment.","source":"GES 107 CA-01 (Section B Q26)"},{"id":212,"question":"Oranges are primarily rich dietary sources of complex carbohydrates rather than Vitamin C.","options":["True","False"],"correctAnswer":1,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"False. Oranges are citrus fruits prized primarily for their high ascorbic acid (Vitamin C), water, and soluble fiber content, not as a primary source of dietary carbohydrates.","source":"GES 107 CA-01 (Section B Q27)"},{"id":213,"question":"The liquid transport and nourishing medium for sperm in the male ejaculate is spermatozoa.","options":["True","False"],"correctAnswer":1,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"False. Spermatozoa are the cellular gametes themselves. Semen (seminal plasma), secreted by the seminal vesicles, prostate, and bulbourethral glands, is the liquid transport medium.","source":"GES 107 CA-01 (Section B Q28)"},{"id":214,"question":"In public health and medical parasitology, a 'vector' is defined as:","options":["An organism (typically a biting insect or arthropod) that transfers a pathogen from one infected host to another","An inanimate object like a soiled bedsheet or drinking cup","A surgical needle used in hospitals","A chemical pesticide used to kill weeds"],"correctAnswer":0,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"A biological vector (e.g. Anopheles mosquito, tsetse fly) transmits an infectious agent from one animal or human to another, often acting as a host where the parasite completes part of its life cycle.","source":"GES 107 CA-01 (Page 6 Q14)"},{"id":215,"question":"Puberty is scientifically defined as:","options":["The biological stage of physical growth and maturation during which a human being becomes capable of sexual reproduction","The legal age of obtaining a driver's license","The stage when physical exercise becomes impossible","The cessation of ovarian follicular activity"],"correctAnswer":0,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"Puberty is the period in life marked by the development of secondary sexual characteristics and the acquisition of reproductive capacity.","source":"GES 107 CA-01 (Page 6 Q18)"},{"id":216,"question":"Which lipid-soluble vitamin serves as a premier biological antioxidant that protects polyunsaturated fatty acids in cell membranes from free radical oxidation?","options":["Vitamin E (Tocopherol)","Vitamin D","Vitamin K","Vitamin B6"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Vitamin E acts as a chain-breaking antioxidant in lipid membranes, neutralizing free radicals and preventing lipid peroxidation.","source":"GES 107 CA-01 (Page 6 Q23)"},{"id":217,"question":"Marasmus is a severe form of protein-energy malnutrition occurring in infants and young children characterized by:","options":["Severe deficiency of BOTH calories/energy and protein, leading to severe emaciation, sunken eyes, and 'skin and bones' appearance","Adequate calorie intake with isolated protein deficiency causing protruding potbelly","Severe obesity and high body fat accumulation","Excessive retention of fluids in the soft tissues"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Marasmus is characterized by generalized starvation with severe wasting of muscle and subcutaneous fat. Kwashiorkor is protein deficiency with preserved edema/ascites.","source":"GES 107 CA-01 (Page 22 Q2)"},{"id":218,"question":"The primary endocrine function of the hormone Insulin produced by pancreatic beta cells is to:","options":["Facilitate cellular uptake and utilization of glucose, stimulate glycogen synthesis in liver and muscle, and lower blood glucose levels","Break down glycogen into glucose during fasting to raise blood sugar","Stimulate the production of breast milk after delivery","Trigger the release of the ovum from the Graafian follicle"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Insulin promotes the storage of glucose as glycogen and fat, decreases gluconeogenesis, and maintains euglycemia.","source":"GES 107 CA-01 (Page 22 Q5)"},{"id":219,"question":"Two pathogenic bacterial species notorious for producing potent toxins that damage human host tissues are:","options":["Clostridium tetani (tetanospasmin) and Staphylococcus aureus (enterotoxin/TSST-1)","Lactobacillus bulgaricus and Streptococcus thermophilus","Candida albicans and Trichophyton rubrum","Plasmodium falciparum and Entamoeba histolytica"],"correctAnswer":0,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Clostridium tetani produces the potent neurotoxin tetanospasmin, causing tetanus; Staphylococcus aureus secretes enterotoxins causing severe food poisoning and toxic shock.","source":"GES 107 CA-01 (Page 22 Q7)"},{"id":220,"question":"An adult human being typically requires approximately how many hours of restful sleep every 24 hours to maintain physical and psychological health?","options":["8 hours","2 hours","14 hours","4 hours"],"correctAnswer":0,"topicId":"health-living","topicName":"Concept of Health & Healthy Living","explanation":"Physiological sleep requirements for young adults range between 7 to 8 hours daily for neurocognitive restoration, immune surveillance, and hormonal homeostasis.","source":"GES 107 CA-01 (Page 27 Q15 / Marking Scheme)"},{"id":221,"question":"A 'young person' according to standard World Health Organization (WHO) and United Nations demography is defined as an individual between the ages of:","options":["10-24 years","10-34 years","0-18 years","25-45 years"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"WHO defines: Adolescents = 10-19 years; Youth = 15-24 years; Young People = 10-24 years.","source":"GES 107 CA-01 (Page 27 Q16)"},{"id":222,"question":"Which tertiary and state hospitals are listed in the course materials as key comprehensive HIV/AIDS treatment and care centres in Oyo State, Nigeria?","options":["University College Hospital (UCH) Ibadan, Adeoyo Maternity Hospital, St. Mary Catholic Hospital, and Oluyoro Catholic Hospital","Only patent medicine vendors in street kiosks","Traditional bone-setting centres","None of the above"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"The official course marking guide specifies UCH Ibadan, Adeoyo Maternity Hospital, St. Mary Catholic Hospital, and Oluyoro Catholic Hospital as principal ART delivery centres.","source":"GES 107 Marking Scheme for CA-02 (1 March 2014, Q1)"},{"id":223,"question":"The following are recognized systemic routes of drug administration EXCEPT:","options":["Oral (by mouth)","Intravenous (IV injection into a vein)","Intramuscular (IM injection into muscle)","Sublingual / buccal (under the tongue or cheek)","External application of paint on clothes"],"correctAnswer":4,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"Systemic drug administration delivers drug to the bloodstream via oral, sublingual, rectal, parenteral (IV, IM, SC), and inhalational routes.","source":"GES 107 Marking Scheme (Page 18 Q11)"},{"id":224,"question":"Unexplained progressive weight loss, palpable painless swellings or lumps in body tissues, and persistent chronic cough are recognized warning features of:","options":["Non-communicable diseases (such as various cancers or chronic metabolic diseases)","Acute common cold","Normal athletic conditioning","Healthy growth spurt"],"correctAnswer":0,"topicId":"ncds-genetics","topicName":"Non-Communicable Diseases & Genetics","explanation":"Constitutional 'red-flag' symptoms like unintentional weight loss, persistent lumps, and chronic bleeding warrant urgent medical evaluation for malignancy or chronic disease.","source":"GES 107 Marking Scheme (Page 18 Q12d)"},{"id":225,"question":"Routine long-term clinical management of sickle cell disease (HbSS) to minimize painful crises includes all the following EXCEPT:","options":["Adequate daily oral fluid hydration to prevent erythrocyte hemoconcentration","Daily maintenance supplementation with folic acid","Avoiding exposure to extreme cold, dehydration, and high-altitude hypoxia","Severe deliberate dehydration and rigorous unhydrated exercise in hot sun"],"correctAnswer":3,"topicId":"ncds-genetics","topicName":"Non-Communicable Diseases & Genetics","explanation":"Dehydration, cold exposure, and acidosis induce hemoglobin S polymerization and red cell sickling; high hydration and daily folic acid are life-saving preventive measures.","source":"GES 107 Marking Scheme (Page 19 Q9)"},{"id":226,"question":"The two principal therapeutic reasons why pharmaceutical drugs are administered in clinical medicine are:","options":["To cure disease, control symptoms, arrest progression, or prevent disease (prophylaxis)","To induce recreational euphoria and addiction","To satisfy taste buds and replace nutritional meals","None of the above"],"correctAnswer":0,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"Therapeutic drug usage focuses on curing infections, controlling clinical symptoms (e.g. analgesics), preventing disease (prophylaxis e.g. antimalarials, vaccines), and arresting chronic disease progression.","source":"GES 107 Marking Scheme (Page 19 Q10)"},{"id":227,"question":"What is the United Nations (UN) operational demographic definition of a 'Youth'?","options":["A person between 15 and 24 years of age","A person between 10 and 14 years of age","Any individual under the age of 45","A child under 10 years of age"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"The United Nations officially defines youth as persons between the ages of 15 and 24 years.","source":"GES 107 Marking Scheme (Page 17 Q4)"},{"id":228,"question":"The three major environmental, physiological, and social challenges faced by youth entering university include:","options":["Developmental pubertal changes, environmental adaptation (accommodation/peer group), and cultural transition","Inheriting too much money and lack of school subjects","Excessive sleep and lack of food options","None of the above"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"University matriculation forces youth to navigate physiological maturity, peer pressures, academic lecturing transitions, and hostel accommodation challenges.","source":"GES 107 Marking Scheme (Page 13 Q4 / Page 17 Q5)"},{"id":229,"question":"According to the World Health Organization (WHO), Life Skills are defined as:","options":["Abilities for adaptive and positive behavior that enable individuals to deal effectively with the demands and challenges of everyday life","Physical bodybuilding and athletic weightlifting skills","Mechanical automotive repair and plumbing techniques","Rote memorization of lecture notes without understanding"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"WHO defines life skills as the psychosocial abilities for adaptive and positive behavior enabling individuals to deal effectively with everyday challenges.","source":"GES 107 Marking Scheme (Page 12 Q5)"},{"id":230,"question":"Which of the following is NOT one of the recognized WHO core psychosocial life skills?","options":["Critical thinking and creative problem-solving","Interpersonal communication, empathy, and assertiveness","Coping with emotions and stress management","Aggressive fist-fighting and street combat"],"correctAnswer":3,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"WHO core life skills fall into cognitive skills, interpersonal skills, and emotional coping skills; violent aggression is an antithesis of life skills.","source":"GES 107 Marking Scheme (Page 12 Q6)"},{"id":231,"question":"Drug addiction is medically characterized by all of the following EXCEPT:","options":["An overwhelming compulsion to continue taking the substance and obtain it by any means","A tendency to escalate the dose over time (tolerance)","Psychological and physiological dependence on the drug's effects","Easy and effortless ability to stop using the drug at any time without withdrawal"],"correctAnswer":3,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"Addiction is defined by loss of control, compulsive consumption despite harm, tolerance, and painful withdrawal symptoms upon cessation.","source":"GES 107 Marking Scheme (Page 12 Q10)"},{"id":232,"question":"Studies cited in the GES 107 textbook show that approximately what percentage of pregnancies occurring among unmarried adolescents in Nigeria are unplanned?","options":["About 60%","About 10%","Less than 2%","Over 95%"],"correctAnswer":0,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"Roughly 60% of pregnancies among unmarried young women in Nigeria are unintended, driving high rates of unsafe illegal abortions and maternal morbidity.","source":"GES 107 Code 01 (Q42)"},{"id":233,"question":"What is the mean age of newly admitted first-year undergraduate students at the University of Ibadan according to campus epidemiological data?","options":["18 years","23 years","15 years","27 years"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"The mean age of UI first-year undergraduate students is approximately 18 years, placing them at the transition between late adolescence and young adulthood.","source":"GES 107 Code 01 (Q43)"},{"id":234,"question":"Which global framework established targets to combat HIV/AIDS, malaria, and reduce maternal and under-five mortality by the benchmark year 2015?","options":["The Millennium Development Goals (MDGs)","The Kyoto Protocol","The Geneva Treaty","The Bretton Woods Agreement"],"correctAnswer":0,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"MDGs 4, 5, and 6 explicitly targeted child mortality reduction, maternal health improvement, and halting HIV/AIDS and malaria by 2015.","source":"GES 107 Code 01 (Q23)"},{"id":235,"question":"According to global tuberculosis epidemiological rankings cited in GES 107, Nigeria ranks:","options":["Fourth highest tuberculosis burden in the world","Lowest in the world with no cases","Fiftieth in the world","Second in Europe"],"correctAnswer":0,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"Nigeria bears one of the highest TB disease burdens globally, ranking 4th in the world and 1st in Africa.","source":"GES 107 Code 01 (Q22)"},{"id":236,"question":"The World Bank stressed in its health sector report that what intervention is of the most critical, dire need for the people of Nigeria?","options":["Behavioural change education and preventative communication","Building 100,000 hospital wards","Importation of canned soft drinks","Eliminating all exercise programs"],"correctAnswer":0,"topicId":"health-living","topicName":"Concept of Health & Healthy Living","explanation":"Behavioral change communication and education addresses root causes of communicable and lifestyle diseases far more cost-effectively than hospital construction alone.","source":"GES 107 Code 01 (Q32)"},{"id":237,"question":"In which two developing countries did sustained social investment and universal primary health systems dramatically elevate health status indicators cited in the course text?","options":["Costa Rica and Cuba","Senegal and Kenya","Chad and Niger","India and Pakistan"],"correctAnswer":0,"topicId":"demographics-stats","topicName":"Nigerian Health Demographics & NDHS Data","explanation":"Costa Rica and Cuba are celebrated international case studies where prioritized primary healthcare and female literacy achieved health outcomes comparable to developed nations.","source":"GES 107 Code 01 (Q47)"},{"id":238,"question":"Chemical digestion of dietary starches begins in the oral cavity through the action of which enzyme secreted in saliva?","options":["Salivary amylase (Ptyalin)","Pepsin","Gastric lipase","Trypsin"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Salivary amylase (ptyalin) initiates the enzymatic breakdown of starch polysaccharides into shorter dextrins and maltose in the mouth.","source":"GES 107 PQ (Page 14 Q34)"},{"id":239,"question":"Naturally occurring dietary carbohydrates and sugars can be ranked in descending order of sweetness as:","options":["Fructose > Sucrose > Glucose > Maltose > Galactose > Lactose","Lactose > Starch > Glucose > Fructose","Glucose > Fructose > Sucrose > Lactose","Starch > Glycogen > Maltose > Sucrose"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Fructose is the sweetest naturally occurring sugar, followed by sucrose (table sugar), glucose, maltose, and lastly lactose (milk sugar).","source":"GES 107 PQ (Page 10 Q21)"},{"id":240,"question":"Hydrogenation of edible vegetable oils is a chemical process that:","options":["Adds hydrogen atoms across unsaturated double bonds to produce solid or semi-solid fats (like margarine)","Removes all fat-soluble vitamins from oils","Converts carbohydrates into protein","Causes instant bacterial decay"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Hydrogenation converts liquid polyunsaturated vegetable oils into solid fats by saturating the carbon-carbon double bonds with hydrogen.","source":"GES 107 PQ (Page 11 Q23)"},{"id":241,"question":"Over what proportion of all dietary lipids consumed in food are in the chemical form of Triglycerides?","options":["Over 90% to 95%","About 25%","Less than 10%","Exactly 50%"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Approximately 90% to 95% of fats in foods (and in human fat depots) exist as triglycerides, consisting of glycerol esterified with three fatty acid chains.","source":"GES 107 PQ (Page 11 Q25)"},{"id":242,"question":"Saturated fatty acids in the human diet are found mostly in:","options":["Animal products (butter, cheese, red meat, lard)","Plant seed oils","Fresh fruits","Vegetable broths"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Saturated fats (solid at room temperature) predominate in animal tissues and dairy products, whereas vegetable and marine oils are rich in unsaturated fatty acids.","source":"GES 107 PQ (Page 12 Q26)"},{"id":243,"question":"Unsaturated fatty acids (with one or more double bonds) are found predominantly in:","options":["Plant seeds and vegetable oils","Animal fat and lard","Beef tallow","Processed butter only"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Unsaturated fatty acids are abundant in plant seeds (soybean, sunflower, canola, olive) and oily fish.","source":"GES 107 PQ (Page 12 Q27)"},{"id":244,"question":"The primary excretory organ responsible for filtering metabolic waste products from blood to produce urine is the:","options":["Kidney","Liver","Spleen","Pancreas"],"correctAnswer":0,"topicId":"health-living","topicName":"Concept of Health & Healthy Living","explanation":"The kidneys filter blood plasma, remove metabolic nitrogenous wastes (urea, creatinine), and regulate fluid, electrolyte, and acid-base balance.","source":"GES 107 PQ (Page 13 Q31)"},{"id":245,"question":"The biological process whereby digested nutrients are transferred from the intestinal lumen across epithelial cells into blood and lymph circulation is called:","options":["Absorption","Mastication","Ingestion","Elimination"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Absorption is the movement of digested food molecules across the intestinal mucosa into the bloodstream or lymphatic lacteals.","source":"GES 107 PQ (Page 13 Q33)"},{"id":246,"question":"Which of the following is NOT a physiological function of bones in the human body?","options":["Providing a structural framework and levers for muscle attachment","Mechanical protection of internal organs (brain in skull, heart in ribcage)","Hematopoiesis (production of red and white blood cells in marrow)","Direct secretion of digestive hydrochloric acid into the stomach"],"correctAnswer":3,"topicId":"health-living","topicName":"Concept of Health & Healthy Living","explanation":"Bones provide structural support, protection, mineral storage, and blood cell formation. Gastric parietal cells in the stomach secrete hydrochloric acid, not bones.","source":"GES 107 PQ (Page 14 Q38)"},{"id":247,"question":"Microorganisms that normally live on or inside human tissues without causing pathology and can provide beneficial barrier and metabolic functions are called:","options":["Non-pathogens (Commensal microbiota)","Virulent pathogens","Tapeworms","Strict parasites"],"correctAnswer":0,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Non-pathogens (such as gut flora) synthesize vitamins, aid digestion, and prevent colonization by harmful pathogenic microbes.","source":"GES 107 PQ (Page 15 Q41)"},{"id":248,"question":"Which specialized plant vascular tissue is responsible for translocating organic photosynthetic nutrients (sugars) throughout the plant?","options":["Phloem","Xylem","Cortex","Stomata"],"correctAnswer":0,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Phloem transports photosynthetic assimilates (sucrose) bidirectionally, whereas xylem transports water and inorganic minerals upwards from roots.","source":"GES 107 PQ (Page 15 Q40)"},{"id":249,"question":"Which essential nutrient is most easily destroyed by high heat, prolonged boiling, and exposure to air during domestic food preparation?","options":["Vitamin C (and Vitamin A)","Iron mineral","Calcium","Table Salt (Sodium chloride)"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Vitamin C (ascorbic acid) is water-soluble and heat-labile; it readily degrades when exposed to heat, air, and cooking water.","source":"GES 107 2nd Semester General CA (Page 1 Q1)"},{"id":250,"question":"The sequence of biological and pathological events from host exposure to an infectious microbe to the manifestation of disease is called:","options":["Pathogenesis","Infectivity","Bacterial colonization","Immune surveillance"],"correctAnswer":0,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Pathogenesis is the biological mechanism and progression by which an etiology or pathogen causes morbid changes in the host.","source":"GES 107 2nd Semester General CA (Page 2 Q4)"},{"id":251,"question":"A teacher observes that a young student is squinting and struggling to read letters written on the classroom blackboard. Increasing which vitamin in her diet is clinically indicated?","options":["Vitamin A","Vitamin K","Vitamin D","Vitamin B12"],"correctAnswer":0,"topicId":"nutrition","topicName":"Nutrition, Nutrients & Dietetics","explanation":"Vitamin A deficiency causes ocular surface keratinization (Bitot's spots) and impairs visual phototransduction, causing visual difficulty.","source":"GES 107 2nd Semester General CA (Page 3 Q8)"},{"id":252,"question":"Merely being without bodily pain, disease symptoms, or physical infirmity is a complete and sufficient guarantee that an individual is in total health.","options":["True","False"],"correctAnswer":1,"topicId":"health-living","topicName":"Concept of Health & Healthy Living","explanation":"False. The WHO definition explicitly emphasizes that health is a complete state of physical, mental, and social well-being, not merely the absence of disease or infirmity.","source":"GES 107 2nd Semester General CA (Page 4 Q9)"},{"id":253,"question":"All the following socio-cultural and behavioral factors explain why HIV affects young people disproportionately EXCEPT:","options":["Gender inequalities and economic dependence","Lack of comprehensive reproductive health and STI information","Adolescent feelings of invulnerability and denial that AIDS exists","Inability of young people to have any biological capacity for self-control"],"correctAnswer":3,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"Young people possess capacity for self-regulation; structural vulnerability stems from lack of information, power imbalances, and risk-taking psychology, not an inherent inability to control oneself.","source":"GES 107 2nd Semester General CA (Page 4 Q11)"},{"id":254,"question":"All the following are developmental characteristics of adolescence EXCEPT:","options":["Rapid pubertal physical growth spurt and hormonal changes","Developing deeper and more intense relationships with peer groups","Forming personal identity and making major life decisions","Total economic self-sustenance and complete financial independence from family"],"correctAnswer":3,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"Adolescents are still undergoing developmental socialization and typically depend on parents/guardians for economic sustenance and shelter.","source":"GES 107 2nd Semester General CA (Page 6 Q15)"},{"id":255,"question":"Which of the following occupational groups is NOT typically classified in epidemiological surveillance as having an elevated mobility risk for contracting STIs?","options":["Long-distance interstate truck drivers","Members of the armed forces on prolonged mobile deployments","Itinerant commercial salesmen with high geographic mobility","Primary school classroom teachers"],"correctAnswer":3,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Occupational cohorts with high geographic mobility and prolonged separation from families (truck drivers, mobile soldiers, traveling salesmen) have elevated behavioral risk for STIs.","source":"GES 107 2024/2025 CA Batch 1 (Page 3)"},{"id":256,"question":"Which molecular diagnostic assay is used specifically to establish HIV infection in exposed infants under 18 months of age?","options":["HIV DNA / RNA Polymerase Chain Reaction (PCR)","Standard rapid antibody screening strip","ELISA antibody test","Urinalysis"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Because maternal anti-HIV IgG antibodies passively cross the placenta, antibody tests remain false-positive for up to 18 months; viral PCR detects the viral nucleic acid directly.","source":"GES 107 2024/2025 CA Batch 1 (Page 2)"},{"id":257,"question":"Which core psychosocial life skill enables individuals to resolve interpersonal conflicts, de-escalate tension, and reach constructive compromises amicably?","options":["Negotiation and conflict resolution skill","Physical combat ability","Dressing and grooming skill","Isolation and avoidance"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"Negotiation is a core life skill that combines active listening, assertiveness, and compromise to settle differences constructively.","source":"GES 107 General CA 2023/2024 (Page 8)"},{"id":258,"question":"Which ethical principle in medical law ensures that diagnostic information on an individual's HIV status is disclosed only to healthcare providers directly involved in their care?","options":["Medical Confidentiality","Public broadcast and announcement","Mandatory workplace reporting","Open access"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Confidentiality ensures that medical test records and diagnostic results are safeguarded from unauthorized disclosure to protect patient dignity.","source":"GES 107 2024/2025 CA Batch 1 (Page 8)"},{"id":259,"question":"Which of the following acute infectious diseases are transmitted via the faecal-oral route through contaminated food or drinking water?","options":["Typhoid fever, Hepatitis A, and Poliomyelitis","Malaria, Yellow fever, and Dengue","HIV, Syphilis, and Gonorrhea","Measles, Influenza, and Chickenpox"],"correctAnswer":0,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Typhoid (Salmonella Typhi), Hepatitis A virus, and Poliovirus are ingested through contaminated water, ice, or uncooked food via the faecal-oral cycle.","source":"GES 107 General CA 2023/2024 (Page 4)"},{"id":260,"question":"Which of the following is an established negative clinical consequence of very early sexual debut among adolescent girls?","options":["Increased biological vulnerability to cervical epithelial tear and STIs (including HPV and HIV)","Improved emotional maturity and resilience","Higher graduation rates with first-class honors","Decreased lifetime risk of unplanned pregnancy"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"In adolescent girls, the cervix has an immature transformation zone (ectopy) with fragile columnar epithelium, greatly elevating susceptibility to STIs, HIV, and HPV.","source":"GES 107 2024/2025 CA Batch 1 (Page 1)"},{"id":261,"question":"Which anatomical passage in the male reproductive system transports both urine from the bladder and semen from ejaculatory ducts out of the body?","options":["The Urethra","The Ureter","The Vas deferens","The Epididymis"],"correctAnswer":0,"topicId":"reproduction","topicName":"Human Reproductive Anatomy & Physiology","explanation":"In males, the urethra serves as a common urogenital canal for the voiding of urine and the expulsion of seminal fluid during ejaculation.","source":"GES 107 General CA 2023/2024 (Page 2)"},{"id":262,"question":"All of the following are examples of IRRATIONAL drug use EXCEPT:","options":["Over-prescribing multiple redundant medications for minor ailments","Self-medication without professional clinical diagnosis","Underuse or premature termination of antibiotic therapy","Taking medications in the medically appropriate dose, dosage interval, and full prescribed course"],"correctAnswer":3,"topicId":"drugs-substances","topicName":"Drugs, Pharmacology & Substance Abuse","explanation":"Rational drug use requires that patients receive medications appropriate to their clinical needs, in doses that meet their individual requirements, for an adequate period of time.","source":"GES 107 First Semester CA 2022 (Page 10 Q30)"},{"id":263,"question":"Regarding personal responsibility and institutional policy on sexual harassment, all the following are mandatory roles EXCEPT:","options":["Never be a perpetrator of sexual harassment","Having a 'tolerable limit' or accepting mild sexual harassment as unavoidable","Reporting any verified sexual harassment incident whether or not one is the direct victim","Making proactive suggestions to eliminate sexual harassment on campus and in workplaces"],"correctAnswer":1,"topicId":"gender-society","topicName":"Gender Equality, Violence & Society","explanation":"Zero-tolerance is the governing standard; having a 'tolerable limit' condones and normalizes predatory behavior.","source":"GES 107 First Semester CA 2022 (Page 13 Q28)"},{"id":264,"question":"Which of the following hemoglobin variants is NOT an allelic genotype of sickle cell disease?","options":["HbCD","HbSS","HbSC","HbSD"],"correctAnswer":0,"topicId":"ncds-genetics","topicName":"Non-Communicable Diseases & Genetics","explanation":"HbCD is a combination of hemoglobin C and D traits and does NOT contain hemoglobin S (the sickling gene); hence it does not cause sickle cell disease.","source":"GES 107 First Semester CA 2022 (Page 13 Q37)"},{"id":265,"question":"During HIV replication inside host cells, which antiretroviral drug class acts to stop the viral enzyme from integrating viral cDNA into the host human chromosome?","options":["Integrase strand transfer inhibitors (INSTIs)","Protease inhibitors","Fusion inhibitors","Reverse transcriptase inhibitors"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"Integrase inhibitors (such as dolutegravir) target the viral integrase enzyme, blocking the insertion of viral cDNA into the host genome.","source":"GES 107 First Semester CA 2022 (Page 5 Q5)"},{"id":266,"question":"In pregnant women living with HIV, does the virus freely and readily cross the intact placenta throughout all stages of gestation?","options":["False - the intact placental syncytiotrophoblast barrier protects the fetus, and transmission occurs mainly during labor/delivery or breastfeeding","True - HIV crosses immediately into the embryo at conception with 100% certainty"],"correctAnswer":0,"topicId":"stis-hiv","topicName":"STIs, HIV/AIDS Prevention & Care","explanation":"False. The intact placenta is an effective biological barrier; in-utero transmission occurs in only a minority of cases, with the majority occurring during intrapartum labor/delivery.","source":"GES 107 First Semester CA 2022 (Page 9 Q13)"},{"id":267,"question":"Which sociological theoretical perspective views youth subcultures as functional transitional structures that assist adolescents in moving from family dependence to societal adulthood?","options":["Functionalist theory","Marxist theory","Interactionalist theory","Activist theory"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"Functionalist sociology regards youth peer groups and subcultures as serving a functional purpose: helping adolescents build autonomous identities and transition into adult social roles.","source":"GES 107 First Semester CA 2022 (Page 3 Q21)"},{"id":268,"question":"Distinct youth subcultures with specialized slang, dress styles, and group rituals were already in existence before the 1950s.","options":["True","False"],"correctAnswer":0,"topicId":"adolescence-youth","topicName":"Adolescence, Youth & Life Skills","explanation":"True. Sociological and historical evidence confirms that organized youth cohorts, apprentice leagues, student guilds, and street countercultures existed long before the 1950s.","source":"GES 107 First Semester CA 2022 (Page 12 Q22)"},{"id":269,"question":"Viruses are obligate intracellular microorganisms, which means that they:","options":["Cannot replicate or reproduce their genetic material unless they are inside another living host cell","Grow and multiply freely in tap water without host cells","Are photosynthetic plants","Are large multicellular organisms"],"correctAnswer":0,"topicId":"infection-microbes","topicName":"Infectious Diseases & Chain of Infection","explanation":"Viruses lack cellular machinery for protein synthesis and ATP generation; they must commandeer a host cell's biochemical apparatus to replicate.","source":"GES 107 General CA 2023/2024 (Page 8)"},{"id":270,"question":"The Common Cold is an acute upper respiratory viral tract infection caused primarily by:","options":["Rhinoviruses (and Coronaviruses / Adenoviruses)","Entamoeba histolytica
